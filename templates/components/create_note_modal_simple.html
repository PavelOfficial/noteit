<!-- 
    Модальный диалог для создания новой заметки
    Чистая HTML-структура с Tailwind CSS классами
    Для использования подключите Tailwind CSS CDN или используйте через npm
-->

<!-- Полупрозрачная темная подложка поверх всего экрана -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50">
    <!-- Центрированная белая карточка с мягкой тенью и скругленными углами -->
    <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl mx-4">
        <!-- Заголовок модального окна -->
        <div class="px-6 py-4 border-b border-gray-200">
            <h3 class="text-lg font-semibold text-gray-900">
                Создать новую заметку
            </h3>
        </div>
        
        <!-- Тело модального окна с формой -->
        <div class="px-6 py-4">
            <form class="space-y-4">
                <!-- Текстовое поле для заголовка заметки -->
                <div>
                    <label for="note-title" class="block text-sm font-medium text-gray-700 mb-2">
                        Заголовок заметки
                    </label>
                    <input 
                        type="text" 
                        id="note-title" 
                        name="title"
                        placeholder="Введите заголовок заметки"
                        class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                        required
                    />
                </div>
                
                <!-- Текстовая область для содержимого -->
                <div>
                    <label for="note-content" class="block text-sm font-medium text-gray-700 mb-2">
                        Содержимое заметки
                    </label>
                    <textarea 
                        id="note-content" 
                        name="content"
                        rows="8"
                        placeholder="Введите содержимое заметки в формате Markdown..."
                        class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 resize-y"
                        required
                    ></textarea>
                    <p class="mt-1 text-xs text-gray-500">
                        Поддерживается синтаксис Markdown
                    </p>
                </div>
            </form>
        </div>
        
        <!-- Футер с кнопками -->
        <div class="px-6 py-4 bg-gray-50 border-t border-gray-200 flex justify-end space-x-3 rounded-b-lg">
            <!-- Вторичная кнопка "Отмена" -->
            <button 
                type="button"
                class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md shadow-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors duration-200"
            >
                Отмена
            </button>
            
            <!-- Основная кнопка "Сохранить заметку" -->
            <button 
                type="submit"
                class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 border border-transparent rounded-md shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors duration-200"
            >
                Сохранить заметку
            </button>
        </div>
    </div>
</div>
