<!-- Модальный диалог для создания новой заметки -->
<!-- Используется Tailwind CSS для стилизации -->

<!-- Полупрозрачная темная подложка поверх всего экрана -->
<div id="createNoteModal" class="hidden fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    <!-- Подложка с затемнением -->
    <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" aria-hidden="true"></div>

    <!-- Центрированная белая карточка -->
    <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
        <!-- Модальная карточка с мягкой тенью и скругленными углами -->
        <div class="relative transform overflow-hidden rounded-lg bg-white text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-2xl">
            <!-- Заголовок модального окна -->
            <div class="bg-white px-4 pb-4 pt-5 sm:p-6 sm:pb-4">
                <div class="sm:flex sm:items-start">
                    <div class="mt-3 text-center sm:ml-4 sm:mt-0 sm:text-left w-full">
                        <h3 class="text-base font-semibold leading-6 text-gray-900 mb-4" id="modal-title">
                            Создать новую заметку
                        </h3>
                        
                        <!-- Форма для создания заметки -->
                        <form id="createNoteForm" class="space-y-4">
                            <!-- Поле для заголовка заметки -->
                            <div>
                                <label for="note-title" class="block text-sm font-medium text-gray-700 mb-1">
                                    Заголовок заметки
                                </label>
                                <input 
                                    type="text" 
                                    id="note-title" 
                                    name="title"
                                    placeholder="Введите заголовок заметки"
                                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm px-3 py-2 border"
                                    required
                                />
                            </div>
                            
                            <!-- Текстовая область для содержимого -->
                            <div>
                                <label for="note-content" class="block text-sm font-medium text-gray-700 mb-1">
                                    Содержимое заметки
                                </label>
                                <textarea 
                                    id="note-content" 
                                    name="content"
                                    rows="8"
                                    placeholder="Введите содержимое заметки в формате Markdown..."
                                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm px-3 py-2 border resize-y"
                                    required
                                ></textarea>
                                <p class="mt-1 text-xs text-gray-500">
                                    Поддерживается синтаксис Markdown
                                </p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            
            <!-- Футер с кнопками -->
            <div class="bg-gray-50 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6">
                <!-- Основная кнопка "Сохранить заметку" -->
                <button 
                    type="submit"
                    form="createNoteForm"
                    class="inline-flex w-full justify-center rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 sm:ml-3 sm:w-auto transition-colors duration-200"
                >
                    Сохранить заметку
                </button>
                
                <!-- Вторичная кнопка "Отмена" -->
                <button 
                    type="button"
                    onclick="closeCreateNoteModal()"
                    class="mt-3 inline-flex w-full justify-center rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50 sm:mt-0 sm:w-auto transition-colors duration-200"
                >
                    Отмена
                </button>
            </div>
        </div>
    </div>
</div>

<!-- JavaScript для управления модальным окном -->
<script>
    // Функция для открытия модального окна
    function openCreateNoteModal() {
        const modal = document.getElementById('createNoteModal');
        modal.classList.remove('hidden');
        // Блокируем прокрутку body при открытой модалке
        document.body.style.overflow = 'hidden';
    }

    // Функция для закрытия модального окна
    function closeCreateNoteModal() {
        const modal = document.getElementById('createNoteModal');
        modal.classList.add('hidden');
        // Восстанавливаем прокрутку body
        document.body.style.overflow = 'auto';
        // Очищаем форму
        document.getElementById('createNoteForm').reset();
    }

    // Закрытие модального окна при клике на подложку
    document.getElementById('createNoteModal')?.addEventListener('click', function(event) {
        if (event.target === this || event.target.classList.contains('bg-gray-500')) {
            closeCreateNoteModal();
        }
    });

    // Закрытие модального окна по клавише Escape
    document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') {
            const modal = document.getElementById('createNoteModal');
            if (!modal.classList.contains('hidden')) {
                closeCreateNoteModal();
            }
        }
    });

    // Обработка отправки формы
    document.getElementById('createNoteForm')?.addEventListener('submit', function(event) {
        event.preventDefault();
        // Здесь можно добавить логику отправки данных на сервер
        // Например, через fetch API или обычную отправку формы
        console.log('Форма отправлена:', {
            title: document.getElementById('note-title').value,
            content: document.getElementById('note-content').value
        });
        // После успешной отправки можно закрыть модалку
        // closeCreateNoteModal();
    });
</script>
